name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Install esptool
        run: python -m pip install esptool

      - name: Build both board profiles
        run: |
          printf '#pragma once\n#define REMOTETERM_FIRMWARE_VERSION "%s"\n' "${{ github.ref_name }}" > include/firmware_version.h
          pio run -e fnk0104b
          pio run -e fnk0104s

      - name: Prepare release assets
        run: |
          mkdir -p release
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          cp .pio/build/fnk0104b/firmware.bin release/remoteterm-display-fnk0104b.bin
          cp .pio/build/fnk0104s/firmware.bin release/remoteterm-display-fnk0104s.bin
          esptool --chip esp32s3 merge_bin --output release/remoteterm-display-fnk0104b-factory.bin --flash-mode dio --flash-size 16MB \
            0x0 .pio/build/fnk0104b/bootloader.bin 0x8000 .pio/build/fnk0104b/partitions.bin \
            0xe000 "$BOOT_APP0" 0x10000 .pio/build/fnk0104b/firmware.bin
          esptool --chip esp32s3 merge_bin --output release/remoteterm-display-fnk0104s-factory.bin --flash-mode dio --flash-size 16MB \
            0x0 .pio/build/fnk0104s/bootloader.bin 0x8000 .pio/build/fnk0104s/partitions.bin \
            0xe000 "$BOOT_APP0" 0x10000 .pio/build/fnk0104s/firmware.bin
          sha256sum release/*.bin > release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra_args=()
          if [[ "${{ github.ref_name }}" == *-* ]]; then extra_args+=(--prerelease); fi
          gh release create "${{ github.ref_name }}" release/* --title "${{ github.ref_name }}" --generate-notes "${extra_args[@]}"